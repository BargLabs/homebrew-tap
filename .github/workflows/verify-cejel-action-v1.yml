name: Verify floating Cejel Action v1

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Cejel runtime version the floating v1 tag must execute
        required: true
        default: '0.4.0'
        type: string

permissions:
  contents: read

jobs:
  consumer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Intentionally floating: this workflow is the external consumer proof required after
      # moving BargLabs/cejel's sole floating Action major tag.
      - name: Run Cejel through the consumer-facing v1 tag
        uses: BargLabs/cejel/action@v1
        with:
          repo-path: .
          out-dir: .cejel-action-v1

      - name: Require the expected consumer runtime version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          actual_version="$(jq -r '.predicate.tool.version' .cejel-action-v1/attestation.json)"
          test "$actual_version" = "$EXPECTED_VERSION"
          echo "Cejel Action v1 consumer runtime version: $actual_version"

      - name: Upload consumer proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cejel-action-v1-consumer-proof
          path: .cejel-action-v1/
          include-hidden-files: true
          if-no-files-found: error
